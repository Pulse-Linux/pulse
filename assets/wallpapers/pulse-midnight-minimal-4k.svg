<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient: Ultra Minimal Obsidian -->
    <linearGradient id="midnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b"/>
      <stop offset="50%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#040407"/>
    </linearGradient>

    <linearGradient id="subtleWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="zenAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="3840" height="2160" fill="url(#midnightBg)"/>

  <!-- Subtle Zen Aura -->
  <circle cx="1920" cy="1080" r="1400" fill="url(#zenAura)"/>

  <!-- Minimal Precision Alignment Marks -->
  <circle cx="1920" cy="1080" r="540" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
  <circle cx="1920" cy="1080" r="360" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  <circle cx="1920" cy="1080" r="180" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" opacity="0.08"/>

  <!-- Hairline Crosshairs -->
  <line x1="1920" y1="480" x2="1920" y2="520" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <line x1="1920" y1="1640" x2="1920" y2="1680" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <line x1="1320" y1="1080" x2="1360" y2="1080" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <line x1="2480" y1="1080" x2="2520" y2="1080" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- Pure Hairline Pulse Wave -->
  <path d="M 0,1080 L 1260,1080 L 1440,1280 L 1620,740 L 1920,1480 L 2220,860 L 2400,1080 L 3840,1080"
        fill="none"
        stroke="url(#subtleWaveGrad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Minimal Brand Monogram -->
  <text x="1920" y="1165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="36" font-weight="300" fill="#f8fafc" letter-spacing="28" text-anchor="middle" opacity="0.85">P U L S E</text>
  <text x="1920" y="1215" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="8" text-anchor="middle" opacity="0.6">M I D N I G H T   M I N I M A L</text>
</svg>
