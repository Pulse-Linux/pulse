<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient: Tactical Carbon Slate -->
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- Terminal Green & Cyber Blue -->
    <linearGradient id="termGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#69f0ae"/>
    </linearGradient>
    <linearGradient id="secBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0081cb"/>
    </linearGradient>

    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#00b0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f141c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tactical Slate Canvas -->
  <rect width="3840" height="2160" fill="url(#slateBg)"/>

  <!-- Tactical Hexagonal Grid Pattern -->
  <pattern id="hexGrid" width="120" height="207.84" patternUnits="userSpaceOnUse">
    <path d="M 60,0 L 120,34.64 L 120,103.92 L 60,138.56 L 0,103.92 L 0,34.64 Z M 60,207.84 L 120,173.2 L 120,103.92 L 60,138.56 L 0,103.92 L 0,173.2 Z" 
          fill="none" stroke="#2a3547" stroke-width="0.75" opacity="0.35"/>
  </pattern>
  <rect width="3840" height="2160" fill="url(#hexGrid)"/>

  <!-- Radar Scan Circles -->
  <circle cx="1920" cy="1080" r="1100" fill="url(#radarSweep)"/>
  <circle cx="1920" cy="1080" r="800" fill="none" stroke="#00e676" stroke-width="1.5" stroke-dasharray="10 20" opacity="0.25"/>
  <circle cx="1920" cy="1080" r="550" fill="none" stroke="#00b0ff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="1920" cy="1080" r="320" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="24 12" opacity="0.5"/>
  <circle cx="1920" cy="1080" r="120" fill="none" stroke="#69f0ae" stroke-width="1.5" opacity="0.4"/>

  <!-- Tactical Crosshair Markers -->
  <line x1="1920" y1="200" x2="1920" y2="1960" stroke="#00e676" stroke-width="1" stroke-dasharray="8 16" opacity="0.2"/>
  <line x1="400" y1="1080" x2="3440" y2="1080" stroke="#00e676" stroke-width="1" stroke-dasharray="8 16" opacity="0.2"/>

  <!-- Precision Shield Polygon -->
  <polygon points="1920,880 2060,940 2060,1140 1920,1260 1780,1140 1780,940" 
           fill="none" stroke="#00e676" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Security Signal Pulse Wave -->
  <path d="M 0,1080 L 1120,1080 L 1320,1380 L 1580,480 L 1920,1680 L 2260,620 L 2520,1080 L 3840,1080"
        fill="none"
        stroke="url(#termGreen)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Secondary Tactical Wave (Cyan) -->
  <path d="M 0,1080 L 1240,1080 L 1440,1240 L 1700,760 L 1920,1460 L 2140,880 L 2400,1080 L 3840,1080"
        fill="none"
        stroke="url(#secBlue)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.75"/>

  <!-- Tactical Telemetry Data Corners -->
  <text x="180" y="240" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#00e676" opacity="0.7" letter-spacing="3">// PULSE SECURITY SUBSYSTEM: ACTIVE</text>
  <text x="180" y="275" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#94a3b8" opacity="0.5" letter-spacing="2">KERNEL_INTEGRITY: ENFORCED | MODULAR_SANDBOX: ISOLATED</text>

  <!-- Central Telemetry Typography -->
  <text x="1920" y="1175" font-family="'JetBrains Mono', monospace" font-size="46" font-weight="700" fill="#f1f5f9" letter-spacing="20" text-anchor="middle">PULSE_SECURITY</text>
  <text x="1920" y="1230" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#00e676" letter-spacing="8" text-anchor="middle" opacity="0.85">TACTICAL DEFENSE &amp; PENETRATION PLATFORM</text>
</svg>
