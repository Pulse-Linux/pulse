<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradient: Deep Cyber Void -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff3399"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="neonGridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00f5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#00f5ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#04060d" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="3840" height="2160" fill="url(#cyberBg)"/>

  <!-- Perspective Horizon Grid -->
  <g stroke="url(#neonGridGrad)" stroke-width="1.5">
    <!-- Horizontal perspective lines -->
    <line x1="0" y1="1100" x2="3840" y2="1100"/>
    <line x1="0" y1="1150" x2="3840" y2="1150"/>
    <line x1="0" y1="1220" x2="3840" y2="1220"/>
    <line x1="0" y1="1310" x2="3840" y2="1310"/>
    <line x1="0" y1="1430" x2="3840" y2="1430"/>
    <line x1="0" y1="1590" x2="3840" y2="1590"/>
    <line x1="0" y1="1810" x2="3840" y2="1810"/>
    <line x1="0" y1="2100" x2="3840" y2="2100"/>

    <!-- Vanishing rays radiating from center -->
    <line x1="1920" y1="1080" x2="-400" y2="2160"/>
    <line x1="1920" y1="1080" x2="200" y2="2160"/>
    <line x1="1920" y1="1080" x2="800" y2="2160"/>
    <line x1="1920" y1="1080" x2="1300" y2="2160"/>
    <line x1="1920" y1="1080" x2="1700" y2="2160"/>
    <line x1="1920" y1="1080" x2="1920" y2="2160"/>
    <line x1="1920" y1="1080" x2="2140" y2="2160"/>
    <line x1="1920" y1="1080" x2="2540" y2="2160"/>
    <line x1="1920" y1="1080" x2="3040" y2="2160"/>
    <line x1="1920" y1="1080" x2="3640" y2="2160"/>
    <line x1="1920" y1="1080" x2="4240" y2="2160"/>
  </g>

  <!-- Central Ambient Illumination -->
  <circle cx="1920" cy="1080" r="950" fill="url(#cyberGlow)"/>

  <!-- High-Tech Neon Rings -->
  <circle cx="1920" cy="1080" r="420" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="12 18" opacity="0.6"/>
  <circle cx="1920" cy="1080" r="320" fill="none" stroke="#ff007f" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="1920" cy="1080" r="220" fill="none" stroke="#00f5ff" stroke-width="3" stroke-dasharray="60 30" opacity="0.9"/>

  <!-- Glowing Cyber Pulse Wave (Cyan) -->
  <path d="M 0,1080 L 1050,1080 L 1280,1460 L 1520,380 L 1920,1820 L 2320,540 L 2560,1080 L 3840,1080"
        fill="none"
        stroke="url(#neonCyan)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonBlur)"/>

  <!-- Secondary Cyber Pulse Wave (Neon Magenta) -->
  <path d="M 0,1080 L 1180,1080 L 1400,1280 L 1660,680 L 1920,1540 L 2180,820 L 2440,1080 L 3840,1080"
        fill="none"
        stroke="url(#neonPink)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonBlur)"
        opacity="0.85"/>

  <!-- Hex Node Highlights -->
  <polygon points="1520,380 1540,368 1560,380 1560,404 1540,416 1520,404" fill="#00ffff" filter="url(#neonBlur)"/>
  <polygon points="1920,1820 1940,1808 1960,1820 1960,1844 1940,1856 1920,1844" fill="#ff007f" filter="url(#neonBlur)"/>
  <polygon points="2320,540 2340,528 2360,540 2360,564 2340,576 2320,564" fill="#00ffff" filter="url(#neonBlur)"/>

  <!-- Cyber Brand Typography -->
  <text x="1920" y="1175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="24" text-anchor="middle" filter="url(#neonBlur)">PULSE // CYBER</text>
  <text x="1920" y="1235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-size="18" font-weight="700" fill="#00f5ff" letter-spacing="10" text-anchor="middle" opacity="0.9">SYNTHWAVE CYBERNETIC WORKSTATION</text>
</svg>
