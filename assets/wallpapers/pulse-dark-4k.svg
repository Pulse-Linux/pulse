<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7852ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9d72ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7852ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7852ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#12141a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Canvas -->
  <rect width="3840" height="2160" fill="url(#bgGrad)"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,270 L 3840,270 M 0,540 L 3840,540 M 0,810 L 3840,810 M 0,1080 L 3840,1080 M 0,1350 L 3840,1350 M 0,1620 L 3840,1620 M 0,1890 L 3840,1890"/>
    <path d="M 480,0 L 480,2160 M 960,0 L 960,2160 M 1440,0 L 1440,2160 M 1920,0 L 1920,2160 M 2400,0 L 2400,2160 M 2880,0 L 2880,2160 M 3360,0 L 3360,2160"/>
  </g>

  <!-- Central Ambient Illumination -->
  <circle cx="1920" cy="1080" r="1200" fill="url(#centerGlow)"/>

  <!-- Abstract Polygonal Engineering Vectors -->
  <path d="M -200,2200 L 1200,1080 L 800,2400 Z" fill="#7852ff" opacity="0.04"/>
  <path d="M 4040,-200 L 2600,1080 L 3200,-400 Z" fill="#00d2ff" opacity="0.04"/>

  <!-- Sweeping Primary Pulse Vector Wave -->
  <path d="M 0,1080 L 1100,1080 L 1350,1450 L 1600,450 L 1920,1750 L 2240,650 L 2490,1080 L 3840,1080"
        fill="none"
        stroke="url(#accentBlue)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowEffect)"/>

  <!-- Secondary Resonant Harmonic Wave -->
  <path d="M 0,1080 L 1200,1080 L 1450,1300 L 1700,700 L 1920,1500 L 2140,850 L 2390,1080 L 3840,1080"
        fill="none"
        stroke="url(#accentViolet)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Pulse Core Central Rings -->
  <circle cx="1920" cy="1080" r="420" fill="none" stroke="#232738" stroke-width="2" stroke-dasharray="24 16"/>
  <circle cx="1920" cy="1080" r="320" fill="none" stroke="#7852ff" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="1920" cy="1080" r="240" fill="none" stroke="#00d2ff" stroke-width="1" stroke-dasharray="8 8" stroke-opacity="0.4"/>

  <!-- Floating Data Coordinate Nodes -->
  <circle cx="1920" cy="660" r="5" fill="#00d2ff" filter="url(#glowEffect)"/>
  <circle cx="2340" cy="1080" r="5" fill="#7852ff" filter="url(#glowEffect)"/>
  <circle cx="1920" cy="1500" r="5" fill="#00d2ff" filter="url(#glowEffect)"/>
  <circle cx="1500" cy="1080" r="5" fill="#7852ff" filter="url(#glowEffect)"/>

  <!-- Minimalist Brand Typography -->
  <text x="1920" y="1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="18" text-anchor="middle" opacity="0.9">PULSE LINUX</text>
  <text x="1920" y="1230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#00d2ff" letter-spacing="8" text-anchor="middle" opacity="0.8">DEVELOPER &amp; SECURITY WORKSTATION</text>
</svg>
