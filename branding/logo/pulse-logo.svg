<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d72ff"/>
      <stop offset="50%" stop-color="#7852ff"/>
      <stop offset="100%" stop-color="#4c22cc"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0b1021"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#252a3d" stroke-width="3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#7852ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Shield / Nodes -->
  <circle cx="256" cy="71" r="7" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="441" cy="256" r="7" fill="#7852ff" filter="url(#glow)"/>
  <circle cx="256" cy="441" r="7" fill="#00d2ff" filter="url(#glow)"/>
  <circle cx="71" cy="256" r="7" fill="#7852ff" filter="url(#glow)"/>

  <!-- Pulse Wave Path -->
  <path d="M 96 256 L 160 256 L 195 330 L 235 130 L 275 380 L 315 190 L 350 256 L 416 256" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Dynamic Harmonic Wave -->
  <path d="M 128 256 L 180 256 L 210 300 L 240 170 L 270 340 L 300 220 L 330 256 L 384 256" 
        fill="none" 
        stroke="url(#violetGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        stroke-opacity="0.9"/>

  <!-- Central Pulse Core Flare -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#00d2ff"/>
</svg>
