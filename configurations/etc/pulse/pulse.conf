# Pulse Linux System Configuration
[system]
edition = "Core"
version = "1.0"
codename = "Vanguard"
base_distribution = "Debian 12 (Bookworm)"
architecture = "x86_64"

[repositories]
channel = "pulse-stable"
auto_security_updates = true
pulse_repo_mirror = "https://pkg.pulselinux.org"
debian_repo_mirror = "http://deb.debian.org/debian"

[desktop]
environment = "KDE Plasma"
theme = "PulseDark"
accent_color = "#7852FF"
primary_color = "#0B1021"

[security]
firewall_enabled = true
apparmor_enabled = true
fail2ban_enabled = false
audit_logging = true

[compatibility]
waydroid_enabled = false
wine_enabled = true
proton_path = "/usr/share/steam/compatibilitytools.d/proton"
